[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntheticforge"
version = "0.1.0"
description = "Graph-driven relational and event stream generator with probabilistic lifecycle simulation and chaos injection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandru Motologa" }
]
keywords = [
    "synthetic-data",
    "event-driven",
    "kafka",
    "postgresql",
    "dag",
    "topological-sort",
    "state-machine",
    "markov-chain",
    "chaos-engineering",
    "duckdb",
    "benchmarking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
]
dependencies = [
    "networkx>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "faker>=28.0.0",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
syntheticforge = "syntheticforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/syntheticforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "RUF012", "S110"]
